[project]
name = "raptor"
version = "0.1.0"
description = "RAPTOR / PartitionGuard: Fault-injection harness and sidecar proxy for MCP tool reliability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "fastapi>=0.115.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
