version: "1.0"
tools:
  transfer:
    effectful: true
    idempotent: false
    idempotency_fields:
      - "recipient"
      - "amount"
    dedup_window_seconds: 60.0
    scope: "banking"
    status_check_tool: "get_transfer_status"
    allow_retry: true
  get_transfer_status:
    effectful: false
    idempotent: true
    scope: "banking"
    status_check_tool: null
    allow_retry: true
  a2a_send_message:
    effectful: true
    idempotent: false
    idempotency_fields:
      - "message_id"
    dedup_window_seconds: 60.0
    scope: "a2a"
    status_check_tool: null
    allow_retry: true
